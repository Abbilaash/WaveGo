<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101722">
  <title>{% block title %}Whisper bot Control{% endblock %}</title>
  <style>
    :root {
      --bg: #07111f;
      --bg-2: #0e1a2f;
      --panel: rgba(12, 21, 38, 0.82);
      --panel-strong: rgba(16, 28, 49, 0.95);
      --text: #eef4ff;
      --muted: #9fb1ce;
      --accent: #4de3b7;
      --accent-2: #7dd3fc;
      --border: rgba(157, 177, 206, 0.18);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(77, 227, 183, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(125, 211, 252, 0.16), transparent 28%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 55%, transparent 100%);
      opacity: 0.45;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      position: relative;
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 32px 24px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 26px;
      animation: rise 0.7s ease both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(77, 227, 183, 0.22), rgba(125, 211, 252, 0.18));
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.1rem, 1rem + 1vw, 1.8rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 8px rgba(77, 227, 183, 0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 22px;
      align-items: stretch;
    }

    .panel {
      position: relative;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero {
      padding: 32px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(77, 227, 183, 0.12);
      color: var(--accent);
      border: 1px solid rgba(77, 227, 183, 0.25);
      font-size: 0.86rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title {
      margin: 14px 0 10px;
      font-size: clamp(2.2rem, 3.5vw, 4.8rem);
      line-height: 0.94;
      letter-spacing: -0.05em;
    }

    .lede {
      max-width: 60ch;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 0.95rem + 0.4vw, 1.15rem);
      line-height: 1.7;
    }

    .video-shell {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(157, 177, 206, 0.22);
      background: rgba(4, 10, 18, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      aspect-ratio: 16 / 9;
    }

    .video-feed {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #02070d;
    }

    .video-overlay {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(7, 17, 31, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      font-size: 0.9rem;
      color: var(--text);
    }

    .video-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff5b5b;
      box-shadow: 0 0 0 8px rgba(255, 91, 91, 0.12);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 8px;
    }

    .stat {
      padding: 18px 16px;
      border-radius: var(--radius-lg);
      background: var(--panel-strong);
      border: 1px solid var(--border);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 700;
      word-break: break-word;
    }

    .stack {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .card {
      padding: 22px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .footer {
      margin-top: 20px;
      color: rgba(159, 177, 206, 0.8);
      font-size: 0.92rem;
      text-align: center;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(0.95);
        opacity: 0.75;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 16px 10px 28px;
      }

      .hero,
      .card {
        padding: 18px;
      }

      .title {
        font-size: clamp(2rem, 11vw, 3.2rem);
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>

<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🐕</div>
        <div>
          <h1>WAVEGO - Whisper Bot</h1>
          <p>Robot network dashboard</p>
        </div>
      </div>
      <div class="badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <span id="statusBadgeText">Online</span>
      </div>
    </header>

    {% block content %}{% endblock %}

    <div class="footer">Responsive Jinja frontend served from the robot controller.</div>
  </main>
  {% block scripts %}{% endblock %}
</body>

</html>
